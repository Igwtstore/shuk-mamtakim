# shukmamtakim.com.ar en el VPS — la puerta de entrada (nginx en el host).
# Va en /etc/nginx/sites-available/shuk (lo copia despliegue/instalar-vps.sh).
#
# Certificado: arranca con uno autofirmado (para poder probar antes de mover el DNS).
# Cuando el dominio ya apunte acá:  sudo certbot --nginx -d shukmamtakim.com.ar -d www.shukmamtakim.com.ar
# (certbot reescribe las líneas ssl_certificate de abajo y renueva solo).

# HTTP → HTTPS (y deja pasar el desafío de Let's Encrypt).
server {
    listen 80;
    listen [::]:80;
    server_name shukmamtakim.com.ar www.shukmamtakim.com.ar;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://shukmamtakim.com.ar$request_uri; }
}

# www → apex (Vercel hacía lo mismo, con 308).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.shukmamtakim.com.ar;
    ssl_certificate     /etc/nginx/ssl/shuk/autofirmado.pem;
    ssl_certificate_key /etc/nginx/ssl/shuk/autofirmado.key;
    return 308 https://shukmamtakim.com.ar$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shukmamtakim.com.ar;

    ssl_certificate     /etc/nginx/ssl/shuk/autofirmado.pem;
    ssl_certificate_key /etc/nginx/ssl/shuk/autofirmado.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Si algún día se pone Cloudflare adelante (nube naranja), descomentar para que la IP real
    # (y el país del candado) sea la del visitante y no la de Cloudflare:
    # include /etc/nginx/snippets/cloudflare-ips.conf;
    # real_ip_header CF-Connecting-IP;

    # El lector de tickets manda hasta 12 fotos en base64 y tarda hasta ~200 s.
    client_max_body_size 30m;
    proxy_read_timeout 330s;
    proxy_send_timeout 330s;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;
    gzip_min_length 1024;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
